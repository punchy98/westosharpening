stages:
  - test
  - deploy

default:
  image: node:24.18.0-bookworm-slim
  before_script:
    - . ./scripts/ci/setup-node.sh
    - node --version
    - npm --version
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .tools/

variables:
  NODE_VERSION: "24.18.0"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  ASTRO_TELEMETRY_DISABLED: "1"

build-site:
  stage: test
  script:
    - npm ci --prefer-offline --strict-allow-scripts
    - npm ls --all
    - npm audit --audit-level=high
    - npm run check
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

deploy-pages:
  stage: deploy
  before_script: []
  needs:
    - job: build-site
      artifacts: true
  script:
    - test -f dist/index.html
  pages:
    publish: dist
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
